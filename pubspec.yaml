name: soso
description: "SOS Arena - real-time multiplayer SOS game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_storage: ^12.3.4

  # Auth
  google_sign_in: ^6.2.1

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # UI / fonts / media
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  audioplayers: ^6.1.0
  flutter_local_notifications: ^17.2.3
  flutter_svg: ^2.0.10+1

  # Config / utilities
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  logger: ^2.4.0
  video_player: ^2.11.1
  googleapis_auth: ^1.4.1
  flutter_displaymode: ^0.7.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/sounds/
    - assets/images/
    - assets/icons/
    - assets/videos/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FEF7FF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FEF7FF"
    theme_color: "#6A38D4"
