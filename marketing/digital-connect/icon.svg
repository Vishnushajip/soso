<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B0A2A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="380" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <!-- links from hub to the 4 project nodes -->
    <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.9">
      <line x1="512" y1="512" x2="688.8" y2="335.2"/>
      <line x1="512" y1="512" x2="688.8" y2="688.8"/>
      <line x1="512" y1="512" x2="800" y2="512"/>
      <line x1="512" y1="512" x2="262" y2="512"/>
    </g>
    <!-- the C -->
    <path d="M 688.8 335.2 A 250 250 0 1 0 688.8 688.8" fill="none" stroke="#FFFFFF" stroke-width="70" stroke-linecap="round"/>
    <!-- project nodes -->
    <g stroke="#FFFFFF" stroke-width="13">
      <circle cx="688.8" cy="335.2" r="44" fill="#FBBF24"/>
      <circle cx="688.8" cy="688.8" r="44" fill="#F472B6"/>
      <circle cx="800" cy="512" r="44" fill="#34D399"/>
      <circle cx="262" cy="512" r="44" fill="#A78BFA"/>
    </g>
    <!-- hub -->
    <circle cx="512" cy="512" r="62" fill="#FFFFFF"/>
    <circle cx="512" cy="512" r="26" fill="#4F46E5"/>
  </g>
</svg>
