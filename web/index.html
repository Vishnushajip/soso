    html, body { margin: 0; padding: 0; height: 100%; background: #070410; }

    /* Logo-reveal splash (web only). Plays instantly while Flutter loads,
       then zooms through when the app signals it is ready. */
    #app-loading {
      position: fixed; inset: 0; overflow: hidden; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #1A1230 0%, #070410 100%);

      -webkit-user-select: none; user-select: none;
      transition: opacity .45s ease;
    }
    #app-loading .grid {
      position: absolute; inset: -40px;
      background-image:
        linear-gradient(rgba(58,47,92,.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(58,47,92,.45) 1px, transparent 1px);
      background-size: 38px 38px; background-position: center;
      -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 65%);
              mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 65%);
      opacity: 0; animation: fadeIn .8s ease-out forwards;
    }
    #app-loading .glow {
      position: absolute; left: 50%; top: 42%; width: 90vmax; height: 90vmax;
      transform: translate(-50%, -50%) scale(.4);
      background: radial-gradient(circle, rgba(106,56,212,.5) 0%, rgba(106,56,212,0) 55%);
      opacity: 0; animation: glowIn 1s ease-out forwards, breathe 3s ease-in-out 1s infinite;
    }
    .embers span {
      position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%;
      background: #FFC857; box-shadow: 0 0 8px #FF6A00; opacity: 0;
      animation: rise linear infinite;
    }
    .embers span:nth-child(odd) { background: #FF6A00; width: 3px; height: 3px; }

    .stage { position: relative; display: flex; flex-direction: column; align-items: center;
             transition: transform .45s cubic-bezier(.5,0,.75,0), opacity .45s ease; }
    .badge { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
    .rings { position: absolute; inset: 0; width: 300px; height: 300px; overflow: visible; }
    .rings circle { fill: none; stroke-linecap: round; transform-box: view-box; transform-origin: 150px 150px; }
    .rings .r1 { stroke: #3B82F6; stroke-width: 3; stroke-dasharray: 160 77; stroke-dashoffset: 237;
                 animation: draw 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards, spin 7s linear 1.25s infinite; }
    .rings .r2 { stroke: #FD9D06; stroke-width: 2; stroke-dasharray: 190 99; stroke-dashoffset: 289;
                 animation: draw 1.1s cubic-bezier(.2,.8,.2,1) .3s forwards, spinR 9s linear 1.4s infinite; }

    .logo {
      position: relative; width: 132px; height: 132px; padding: 4px; box-sizing: border-box;
      border-radius: 36px; background: linear-gradient(135deg, #3B82F6, #6A38D4, #FD9D06);
      box-shadow: 0 0 40px rgba(106,56,212,.6), 0 0 80px rgba(253,157,6,.25);
      opacity: 0; transform: scale(0) rotate(-55deg);
      animation: slam .75s cubic-bezier(.2,1.6,.4,1) .6s forwards;
    }
    .logo-float { animation: float 3s ease-in-out 1.6s infinite; }
    .logo .inner { position: relative; width: 100%; height: 100%; border-radius: 32px; overflow: hidden; }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .logo .inner::after {
      content: ""; position: absolute; top: -50%; left: 0; width: 35%; height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
      transform: translateX(-250%) rotate(25deg); animation: shine .7s ease-in-out 1.55s forwards;
    }
    .shock, .shock2, .flash {
      position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none;
      box-sizing: border-box; transform: translate(-50%,-50%) scale(.6); opacity: 0;
    }
    .shock  { width: 150px; height: 150px; border: 6px solid rgba(255,255,255,.85); animation: shock .7s ease-out 1s forwards; }
    .shock2 { width: 150px; height: 150px; border: 3px solid #FFC857; animation: shock .8s ease-out 1.12s forwards; }
    .flash  { width: 260px; height: 260px; background: radial-gradient(circle, rgba(255,255,255,.45), transparent 60%);
              animation: flash .6s ease-out 1s forwards; }
    .sparks { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
    .sparks i {
      position: absolute; left: 0; top: -1.5px; width: 22px; height: 3px; border-radius: 3px;
      background: var(--c); opacity: 0; transform-origin: 0 50%;
      transform: rotate(var(--a)) translateX(60px);
      animation: spark .8s cubic-bezier(.1,.7,.3,1) 1s forwards;
    }

    .sos { position: relative; display: flex; gap: 10px; margin-top: -10px; font-size: 64px; line-height: 1.05; }
    .sos b { font-weight: 400; opacity: 0; transform: translateY(-60px) scale(1.8);

    .sos b:nth-child(1) { color: #3B82F6; animation-delay: 1.4s; }
    .sos b:nth-child(2) { color: #FD9D06; animation-delay: 1.56s; }
    .sos b:nth-child(3) { color: #3B82F6; animation-delay: 1.72s; }
    .sos .strike {
      position: absolute; left: -8px; top: 50%; height: 6px; width: 0; margin-top: -5px; border-radius: 6px;
      background: #FFC857; box-shadow: 0 0 14px rgba(255,200,87,.8);
      animation: strike .35s cubic-bezier(.6,0,.3,1) 2.05s forwards, fadeOut .4s ease 2.75s forwards;
    }
    .arena { margin-top: 8px; font-size: 28px; color: #F1ECFF; letter-spacing: 34px; padding-left: 34px;

    .tagline { margin-top: 18px; font: 700 11.5px/1 'Outfit', system-ui, sans-serif; color: #9C92C7;

    .dots { position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; gap: 10px;
            opacity: 0; transition: opacity .3s ease; }
    #app-loading.waiting .dots { opacity: 1; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; background: #3B82F6; box-shadow: 0 0 8px #3B82F6;

    .dots i:nth-child(2) { background: #FD9D06; box-shadow: 0 0 8px #FD9D06; animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }

    .retry { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; display: none;
             font: 700 13px/1.5 'Outfit', system-ui, sans-serif; color: #9C92C7; letter-spacing: 1px; cursor: pointer; }
    .retry u { color: #FFC857; }
    #app-loading.failed .dots { display: none; }
    #app-loading.failed .retry { display: block; }

    /* Zoom-through exit into the app. */
    #app-loading.exit { opacity: 0; pointer-events: none; }
    #app-loading.exit .stage { transform: scale(1.3); opacity: 0; }

    @keyframes fadeIn  { to { opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; } }
    @keyframes glowIn  { to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
    @keyframes breathe { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
                         50% { transform: translate(-50%,-50%) scale(1.06); opacity: .8; } }
    @keyframes draw    { to { stroke-dashoffset: 0; } }
    @keyframes spin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinR   { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes slam    { 0% { opacity: 0; transform: scale(0) rotate(-55deg); }
                         15% { opacity: 1; }
                         100% { opacity: 1; transform: scale(1) rotate(0deg); } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes shine   { to { transform: translateX(450%) rotate(25deg); } }
    @keyframes shock   { 0% { opacity: 1; transform: translate(-50%,-50%) scale(.85); }
                         100% { opacity: 0; transform: translate(-50%,-50%) scale(2.6); } }
    @keyframes flash   { 0% { opacity: 1; transform: translate(-50%,-50%) scale(.7); }
                         100% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); } }
    @keyframes spark   { 0% { opacity: 1; transform: rotate(var(--a)) translateX(60px) scaleX(1); }
                         100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scaleX(.2); } }
    @keyframes drop    { 0% { opacity: 0; transform: translateY(-60px) scale(1.8); }
                         30% { opacity: 1; }
                         100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes strike  { to { width: calc(100% + 16px); } }
    @keyframes track   { to { opacity: 1; letter-spacing: 10px; padding-left: 10px; } }
    @keyframes rise    { 0% { opacity: 0; transform: translate(0,0); }
                         15% { opacity: .9; }
                         100% { opacity: 0; transform: translate(var(--x), -105vh); } }
    @keyframes bounce  { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

    @media (max-width: 360px) { .stage { transform: scale(.85); } }
    @media (prefers-reduced-motion: reduce) {
      #app-loading *, #app-loading *::after {
        animation-duration: .01s !important; animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

    // 'sos-splash-mounted' when it starts and 'sos-splash-done' once auth is
    // resolved; the reveal always gets to finish before zooming out.
    (function () {
      var INTRO_MS = 2900;
      var start = performance.now();
      var el = document.getElementById('app-loading');
      var mounted = false, exiting = false, skipped = false, painted = false;

      function exit() {
        if (exiting || !el) return;
        exiting = true;
        var wait = skipped ? 0 : Math.max(0, INTRO_MS - (performance.now() - start));
        setTimeout(function () {
          el.classList.add('exit');
          setTimeout(function () { el.remove(); }, 500);
        }, wait);
      }

      setTimeout(function () { if (!exiting) el.classList.add('waiting'); }, INTRO_MS);
      el.addEventListener('click', function () {
        if (el.classList.contains('failed')) { location.reload(); return; }
        skipped = true;
      });
      // If the app hasn't drawn anything after 25s, offer a reload instead of
      // leaving the user staring at the splash.
      setTimeout(function () { if (!painted && !exiting) el.classList.add('failed'); }, 25000);
      window.addEventListener('sos-splash-mounted', function () { mounted = true; });
      window.addEventListener('sos-splash-done', exit);
      window.addEventListener('flutter-first-frame', function () {
        painted = true;
        // Routes that skip the splash (e.g. /privacy) exit right away.
        if (!mounted) exit();
        // Safety net: never trap the user behind the splash.
        setTimeout(exit, 8000);
      });
    })();

    script.async = true;
