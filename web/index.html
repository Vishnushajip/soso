<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SOS Arena — real-time multiplayer SOS game.">
  <meta name="theme-color" content="#070410">

  <!-- Speed up the first connections to the services used on launch -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SOS Arena">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Sign-In web client id (must match GOOGLE_CLIENT_ID_WEB in .env) -->
  <meta name="google-signin-client_id" content="151581458337-tr0g62nffhjpi10rkbt53tkitm0adcud.apps.googleusercontent.com">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SOS Arena</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #070410; }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #1A1230 0%, #070410 70%);
      transition: opacity 0.35s ease;
      z-index: 9999;
    }
    #app-loading.fade-out { opacity: 0; pointer-events: none; }
    #app-loading .logo {
      width: 96px; height: 96px; border-radius: 24px;
      box-shadow: 0 12px 40px rgba(106, 56, 212, 0.45);
      animation: pulse 1.4s ease-in-out infinite;
    }
    #app-loading .title {
      margin-top: 22px; color: #FFC857;
      font-family: 'Trebuchet MS', system-ui, sans-serif;
      font-weight: 800; letter-spacing: 2px; font-size: 18px;
    }
    #app-loading .spinner {
      margin-top: 18px; width: 28px; height: 28px;
      border: 3px solid rgba(255, 200, 87, 0.25);
      border-top-color: #FFC857; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <img class="logo" src="icons/Icon-192.png" alt="SOS Arena" />
    <div class="title">SOS ARENA</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove the loading screen once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 400);
      }
    });

    var script = document.createElement("script");
    script.src = "flutter_bootstrap.js?v=" + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
