<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Bubble gradient -->
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Tail gradient -->
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <!-- Dots gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- Tail / Pointer -->
  <path d="M 18 42 C 16 48 11 53 7 55 C 13 54 19 50 22 46 Z"
        fill="url(#tailGrad)"/>

  <!-- Main Rounded Speech Bubble Body -->
  <rect x="8" y="10" width="48" height="38" rx="19" ry="19"
        fill="url(#chatGrad)"/>

  <!-- 3D Gloss Highlight on Upper Rim -->
  <path d="M 17 14 C 21 12.5 26 12 32 12 C 38 12 43 12.5 47 14 C 43 17 38 18 32 18 C 26 18 21 17 17 14 Z"
        fill="#FFFFFF" opacity="0.45"/>

  <!-- Specular Glow Dot -->
  <ellipse cx="20" cy="18" rx="3.5" ry="2" transform="rotate(-15 20 18)" fill="#FFFFFF" opacity="0.65"/>

  <!-- Three Conversation Dots -->
  <circle cx="23" cy="29" r="3.2" fill="url(#dotGrad)"/>
  <circle cx="32" cy="29" r="3.2" fill="url(#dotGrad)"/>
  <circle cx="41" cy="29" r="3.2" fill="url(#dotGrad)"/>
</svg>
